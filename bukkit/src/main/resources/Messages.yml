# ============================================================================ #
#                         PhantomBans Messages                                 #
# ============================================================================ #
# Uses MiniMessage format (<red>, <gray>, <bold>, <gradient>, etc.)
#
# Documentation: https://docs.advntr.dev/minimessage/format.html
#
# Placeholders:
#   %NAME%      - Target player name
#   %OPERATOR%  - Staff who executed the command
#   %REASON%    - Punishment reason
#   %DURATION%  - Punishment duration text
#   %ID%        - Punishment numeric ID
#   %HEXID%     - Punishment hexadecimal ID
#   %DATE%      - Punishment creation date
#   %COUNT%     - Warning/note count
#   %PAGE%      - Current page number
#   %CURRENT_PAGE% - Current page
#   %TOTAL_PAGES% - Total pages
#   %NEXT_PAGE%   - Next page number
# ============================================================================ #

# --------------------------------------------------------------------------- #
# GENERAL                                                                     #
# --------------------------------------------------------------------------- #
General:
  Prefix: "<dark_gray>[<red>PhantomBans<dark_gray>]</dark_gray>"
  NoPerms: "<red>You don't have permission to use this command!"
  FailedFetch: "<red>Failed to fetch <white>%NAME%<red>'s UUID!"
  LayoutNotFound: "<red>Layout '<white>%NAME%<red>' not found!"
  TimeLayoutD: "<white>%DD% <gray>days <white>%HH% <gray>hours <white>%MM% <gray>minutes <white>%SS% <gray>seconds"
  TimeLayoutH: "<white>%HH% <gray>hours <white>%MM% <gray>minutes <white>%SS% <gray>seconds"
  TimeLayoutM: "<white>%MM% <gray>minutes <white>%SS% <gray>seconds"
  TimeLayoutS: "<white>%SS% <gray>seconds"

# --------------------------------------------------------------------------- #
# BAN                                                                         #
# --------------------------------------------------------------------------- #
Ban:
  Usage: "<red>Usage <dark_gray>» <gray><italic>/ban [Name] [Reason]"
  Done: "<red><italic>%NAME% <gray>was successfully banned!"
  Exempt: "<gray>You are not able to ban <red><italic>%NAME%"
  Notification:
    - "<dark_gray>[<red>!<dark_gray>] <red><italic>%NAME% <gray>was banned by <yellow><italic>%OPERATOR%"
    - "  <gray>Reason: <italic>%REASON%"
  Layout:
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    - "<dark_gray>┃"
    - "<dark_gray>┃ <red><bold>You have been banned!"
    - "<dark_gray>┃"
    - "<dark_gray>┃ <gray>Reason: <white>%REASON%"
    - "<dark_gray>┃ <gray>Operator: <white>%OPERATOR%"
    - "<dark_gray>┃ <gray>Date: <white>%DATE%"
    - "<dark_gray>┃ <gray>ID: <white>#%HEXID%"
    - "<dark_gray>┃"
    - "<dark_gray>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

