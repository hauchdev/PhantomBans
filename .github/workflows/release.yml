name: Release

on:
  push:
    tags:
      - 'v*'          # v1.0.0, v2.3.4, etc.
      - '[0-9]+.*'    # 1.0.0, 2.3.4, etc.

jobs:
  release:
    name: "📦 Build release ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: "🔨 Compile & package"
        run: mvn package --batch-mode -DskipTests

      - name: "📁 Collect artifacts"
        id: artifacts
        run: |
          mkdir -p release-artifacts
          # Copy JARs, flattening module directories
          find . -path '*/target/*.jar' -not -name 'original-*.jar' -not -name '*sources*' \
            -exec cp {} release-artifacts/ \;
          echo "files=$(ls release-artifacts/ | wc -l) artifact(s) collected"

      - name: "🏷️ Extract version from tag"
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: "📝 Generate release notes"
        id: notes
        run: |
          {
            echo "## PhantomBans ${{ steps.version.outputs.version }}"
            echo ""
            echo "### 📦 Downloads"
            echo ""
            for jar in release-artifacts/*.jar; do
              name=$(basename "$jar")
              module="${name%%-*}"
              echo "- \`$name\`"
            done
            echo ""
            echo "---"
            echo "*Automatically built by GitHub Actions*"
          } > release-notes.md

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "PhantomBans ${{ steps.version.outputs.version }}"
          body_path: release-notes.md
          files: release-artifacts/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
